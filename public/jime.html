<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Jime</title>
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Para Jime 🤍">
<meta property="og:description" content="Una carta digital. Ábrela.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7efe0; --paper2:#f1e6d2; --ink:#5a4636; --ink-soft:#8a7359;
    --rose:#b76e79; --rose-soft:#d99aa3; --gold:#c0922f; --line:#d8c7ab;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    min-height:100%; font-family:'Cormorant Garamond',Georgia,serif; color:var(--ink);
    background:
      radial-gradient(120% 90% at 50% -10%, #f6e7e4 0%, rgba(246,231,228,0) 55%),
      linear-gradient(160deg,#f3e2de 0%,#efe6d4 48%,#eadfc7 100%);
    display:flex; align-items:center; justify-content:center;
    padding:clamp(16px,4vw,40px); overflow-x:hidden;
  }
  /* corazones flotando */
  .hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .hearts b{position:absolute;bottom:-40px;color:var(--rose-soft);opacity:.0;animation:rise linear infinite;font-size:18px}
  @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.5}90%{opacity:.5}100%{transform:translateY(-112vh) rotate(40deg);opacity:0}}

  .scene{position:relative;z-index:1;perspective:1600px;width:min(94vw,430px)}
  .card{position:relative;width:100%;min-height:min(78vh,620px);transform-style:preserve-3d}

  /* ---- Carta (adentro) ---- */
  .inside{
    position:absolute;inset:0;border-radius:14px;
    background:
      repeating-linear-gradient(transparent,transparent 37px,rgba(183,110,121,.10) 38px),
      linear-gradient(180deg,var(--paper),var(--paper2));
    box-shadow:0 30px 60px -22px rgba(90,70,54,.5), inset 0 0 0 1px rgba(192,146,47,.18);
    padding:30px 26px 38px; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .inside::before{content:"🤍";position:absolute;top:12px;right:16px;font-size:16px;opacity:.6}
  .for{font-family:'Dancing Script',cursive;color:var(--rose);font-size:26px;margin:2px 0 14px;text-align:center}
  .letter{font-family:'Caveat',cursive;font-size:clamp(20px,5.4vw,23px);line-height:1.5;color:var(--ink);white-space:pre-wrap}
  .letter p{margin:0 0 15px}
  .letter .aside{color:var(--ink-soft);font-style:italic}
  .letter .end{font-family:'Dancing Script',cursive;color:var(--rose);font-size:clamp(26px,7vw,32px);line-height:1.2;margin-top:6px}
  .cursor{display:inline-block;width:2px;height:1em;background:var(--rose);margin-left:1px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ---- Portada (postal vintage) ---- */
  .cover{
    position:absolute;inset:0;border-radius:14px;z-index:3;cursor:pointer;
    transform-origin:50% 0%;transition:transform 1.35s cubic-bezier(.3,.9,.25,1), opacity .4s ease 1s;
    background:linear-gradient(150deg,#f8f0df,#efe2c9);
    box-shadow:0 26px 54px -20px rgba(90,70,54,.55), inset 0 0 0 1px rgba(192,146,47,.25);
    padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    backface-visibility:hidden;
  }
  .cover .frame{position:absolute;inset:14px;border:1.5px solid var(--line);border-radius:8px}
  .cover .frame::after{content:"";position:absolute;inset:5px;border:1px dashed rgba(192,146,47,.5);border-radius:5px}
  /* timbre */
  .stamp{position:absolute;top:22px;right:22px;width:52px;height:62px;border-radius:3px;
    background:linear-gradient(160deg,#e9c3c7,#d99aa3);padding:4px;
    box-shadow:0 2px 6px rgba(90,70,54,.25);
    -webkit-mask:radial-gradient(circle at 50% -3px,transparent 3px,#000 3.2px) 0 0/8px 100%,
                 radial-gradient(circle at 50% calc(100% + 3px),transparent 3px,#000 3.2px) 0 100%/8px 100%,
                 radial-gradient(circle at -3px 50%,transparent 3px,#000 3.2px) 0 0/100% 8px,
                 radial-gradient(circle at calc(100% + 3px) 50%,transparent 3px,#000 3.2px) 100% 0/100% 8px;
    -webkit-mask-composite:source-over;mask-composite:add}
  .stamp i{display:flex;width:100%;height:100%;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.6);border-radius:2px;font-style:normal;font-size:22px}
  /* matasellos */
  .postmark{position:absolute;top:30px;right:70px;width:64px;height:64px;border:2px solid rgba(183,110,121,.45);
    border-radius:50%;color:rgba(183,110,121,.55);font-family:'Cormorant Garamond',serif;
    display:flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:.5px;transform:rotate(-12deg);text-align:center;line-height:1.1}
  .cover .eye{font-family:'Cormorant Garamond',serif;letter-spacing:4px;text-transform:uppercase;font-size:12px;color:var(--ink-soft);margin-bottom:10px}
  .cover h1{font-family:'Dancing Script',cursive;font-weight:700;color:var(--rose);margin:0;
    font-size:clamp(34px,10vw,46px);line-height:1.05;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .cover .sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink);font-size:clamp(17px,4.6vw,20px);margin-top:8px}
  .cover .flour{color:var(--gold);font-size:20px;margin-top:14px;letter-spacing:6px}
  .hint{position:absolute;bottom:20px;left:0;right:0;font-family:'Cormorant Garamond',serif;
    letter-spacing:3px;text-transform:uppercase;font-size:11px;color:var(--ink-soft);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}

  .card.open .cover{transform:rotateX(-168deg);opacity:0;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.cover{transition:opacity .5s} .card.open .cover{transform:none;opacity:0} .hearts{display:none}}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<div class="scene">
  <div class="card" id="card">
    <div class="inside" id="inside">
      <div class="for">Para Jime</div>
      <div class="letter" id="letter"></div>
    </div>

    <div class="cover" id="cover" role="button" tabindex="0" aria-label="Abrir la carta">
      <div class="frame"></div>
      <div class="stamp"><i>🤍</i></div>
      <div class="postmark">CDMX<br>· 15 · OCT ·</div>
      <div class="eye">una carta para ti</div>
      <h1>Happy Birthday<br>my love</h1>
      <div class="sub">de Santiago, con todo</div>
      <div class="flour">✶ ❦ ✶</div>
      <div class="hint">toca para abrir</div>
    </div>
  </div>
</div>

<script>
(function(){
  // corazones
  var H=document.getElementById('hearts');
  for(var i=0;i<14;i++){var b=document.createElement('b');b.textContent='♥';
    b.style.left=(Math.random()*100)+'%';
    b.style.fontSize=(12+Math.random()*16)+'px';
    b.style.animationDuration=(9+Math.random()*9)+'s';
    b.style.animationDelay=(Math.random()*12)+'s';H.appendChild(b);}

  var paras=[
    `Jime:`,
    `Llevo días intentando escribirte esta carta. Escribo, borro, se me ocurre algo, me acerco, me alejo y vuelvo a empezar. Hoy son las 8:27 y aquí sigo. A lo mejor tengo que escribir 29 cartas antes de que me salga la buena, una por cada año que cumples.`,
    `Ya sé, es solo una carta. Pero es tu cumpleaños y este año mi regalo son palabras. Me encantaría regalarte mil cosas, un viaje, pero por ahora el único viaje que te puedo regalar es por mis pensamientos. Y me gusta saber que con eso te basta, porque sé que no estás conmigo por nada material.`,
    `Buscando qué escribirte me di cuenta de que últimamente vivo buscando. Busco trabajo, busco dónde vivir, busco qué sigue. Y buscar cansa: unas cosas te aburren, otras te quedan grandes y piden credenciales que no tienes, y cuando sientes que ya estás cerca, se cae y vuelves a empezar. Igualito que con esta carta.`,
    `@(Ya sé lo que estás pensando: "otra vez este con su búsqueda de chamba, qué hueva". Aguanta, aquí viene lo bueno.)`,
    `La vida es un poco eso, una lista de búsquedas. Unas duran años y otras se resuelven sin que te des cuenta. Y lo curioso es que casi nunca notas el día en que dejas de buscar algo. Un día volteas y ya no estás buscando, porque ya lo encontraste.`,
    `Hace no tanto estuve en otra búsqueda que se sentía igual. Estaba buscando algo fuera de mi liga, algo que pedía credenciales que yo no tenía. Esa vez no buscaba trabajo, te buscaba a ti.`,
    `Porque si ser tu novio hubiera sido una vacante, los requisitos habrían sido: chamba estable, depa propio y la vida resuelta. Yo no cumplía ni uno. Apliqué igual. Y aquí estoy.`,
    `Luego me dices que ya no sabes qué consejo darme. Ya me lo diste sin darte cuenta: lo que vale la pena sí llega, aunque al principio parezca que no. Así que no me preocupa tanto lo que me falta. Si ya encontré lo más difícil, lo demás va a llegar.`,
    `Y si algún día te toca a ti estar buscando algo, acuérdate de esta carta: sí llega. Y mientras, lo buscamos juntos.`,
    `Así que sigo buscando trabajo, casa y todo lo demás. A ti ya no.`,
    `Al final no necesité 29 cartas. Solo tuve que ponerme a pensar en ti.`,
    `#Feliz cumpleaños, Jimis.`
  ];

  var card=document.getElementById('card'), cover=document.getElementById('cover'), letter=document.getElementById('letter');
  var opened=false, typing=false, done=false, reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  function build(p){ // crea el <p> con clases segun marcador
    var cls='', txt=p;
    if(p[0]==='@'){cls=' class="aside"';txt=p.slice(1);}
    else if(p[0]==='#'){cls=' class="end"';txt=p.slice(1);}
    var el=document.createElement('p'); if(cls) el.className=cls.replace(' class="','').replace('"','');
    return {el:el,txt:txt};
  }

  function reveal(){ // muestra todo de golpe
    letter.innerHTML='';
    paras.forEach(function(p){var b=build(p);b.el.textContent=b.txt;letter.appendChild(b.el);});
    done=true; typing=false;
  }

  function typeAll(){
    typing=true; letter.innerHTML='';
    var cursor=document.createElement('span'); cursor.className='cursor';
    var pi=0;
    function nextPara(){
      if(pi>=paras.length){ if(cursor.parentNode)cursor.remove(); typing=false; done=true; return; }
      var b=build(paras[pi]); letter.appendChild(b.el); b.el.appendChild(cursor);
      var ci=0, s=b.txt;
      (function typeChar(){
        if(!typing){return;}
        if(ci<s.length){
          b.el.insertBefore(document.createTextNode(s[ci]), cursor);
          ci++;
          document.getElementById('inside').scrollTop=999999;
          var ch=s[ci-1];
          var d = (ch==='.'||ch===','||ch===':'||ch==='?') ? 120 : (18+Math.random()*34);
          setTimeout(typeChar,d);
        } else {
          pi++; setTimeout(nextPara, 440);
        }
      })();
    }
    nextPara();
  }

  function open(){
    if(opened) return; opened=true; card.classList.add('open');
    var wait = reduce ? 500 : 1200;
    setTimeout(function(){ if(reduce){reveal();} else {typeAll();} }, wait);
  }

  cover.addEventListener('click', open);
  cover.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' ') open(); });
  // tocar la carta mientras se escribe = mostrar todo
  document.getElementById('inside').addEventListener('click', function(){ if(opened && typing){ typing=false; reveal(); } });
})();
</script>
</body>
</html>
