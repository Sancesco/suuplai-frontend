<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Para Jimis</title>
<meta name="robots" content="noindex,nofollow">
<meta property="og:title" content="Para Jimis">
<meta property="og:description" content="Una carta. Tienes la clave.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Fondo galería, un sobre ultramarino, countdown en serif enorme; la clave lo abre y la carta se escribe (y se corrige) sola. */
:root{
  --ground:#eeebe5;
  --paper:#f8f6f2;
  --ink:#141414;
  --soft:#86827b;
  --line:#d6d2ca;
  --blue:#1f35d1;
  --blue-deep:#16269c;
  --serif:"Instrument Serif", "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --hand:"Patrick Hand", "Segoe Print", "Comic Sans MS", cursive;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--serif);margin:0;min-height:100vh;padding-inline:16px;padding-block:0;overflow-x:hidden}
main{max-width:46rem;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:2.6rem;padding-block:clamp(2.5rem,8vh,5rem) 7rem}
section{width:100%}
.label{font-family:var(--mono);font-size:.64rem;letter-spacing:.28em;text-transform:uppercase;color:var(--soft)}

/* ---------- Escenario ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:2.5rem}
.env{position:relative;width:min(620px,100%);aspect-ratio:1.6;perspective:1600px}
.env > div{position:absolute;inset:0}
.back{background:var(--blue-deep);z-index:1;box-shadow:0 1px 2px rgba(20,20,40,.15),0 40px 70px -30px rgba(22,38,156,.55)}
.sheet{z-index:2;inset:5% 4% 4% 4% !important;background:var(--paper);transition:transform 1.2s cubic-bezier(.2,.8,.2,1) .6s}
.front{z-index:3;background:var(--blue);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);
  display:flex;align-items:flex-end;justify-content:space-between;padding:0 6% 6%}
.front::after{content:"";position:absolute;inset:0;background:
  linear-gradient(to top right,transparent calc(50% - .5px),rgba(0,0,0,.18) 50%,transparent calc(50% + .5px)) left bottom/50% 46% no-repeat,
  linear-gradient(to top left,transparent calc(50% - .5px),rgba(0,0,0,.18) 50%,transparent calc(50% + .5px)) right bottom/50% 46% no-repeat}
.front span{position:relative;z-index:1;font-family:var(--mono);font-size:clamp(.55rem,1.6vw,.68rem);letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.flap{z-index:4;background:linear-gradient(180deg,#2a40e0,var(--blue));clip-path:polygon(0 0,100% 0,50% 58%);transform-origin:top center;
  transition:transform .8s cubic-bezier(.6,0,.3,1), z-index 0s linear .4s}

.seal{position:absolute;z-index:6;left:50%;top:58%;transform:translate(-50%,-50%);width:clamp(64px,13vw,88px);aspect-ratio:1;transition:opacity .4s}
.seal .wax{position:absolute;inset:12%;border-radius:50%;background:var(--paper);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 6px 16px rgba(10,20,90,.35);
  display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-size:clamp(1.6rem,4.4vw,2.3rem);color:var(--blue)}
.env.shake{animation:shake .35s}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .seal{opacity:0;pointer-events:none}
.env.open .sheet{transform:translateY(-42%)}

.status{display:flex;flex-direction:column;align-items:center;gap:1.1rem;text-align:center}
.count{display:flex;align-items:flex-start;gap:clamp(.6rem,3vw,1.6rem);font-variant-numeric:tabular-nums lining-nums}
.count div{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.count b{font-weight:400;font-size:clamp(3.4rem,14vw,7rem);line-height:.9;letter-spacing:-.02em}
.count small{font-family:var(--mono);font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;color:var(--soft)}

/* ---------- Clave ---------- */
.keyform{display:flex;gap:.7rem;align-items:center;margin-top:.2rem}
.keyform input{width:5.6rem;text-align:center;font-family:var(--serif);font-size:2.2rem;color:var(--ink);
  background:transparent;border:0;border-bottom:1.5px solid var(--line);padding:.1rem .2rem .25rem;outline:none;letter-spacing:.35em}
.keyform input:focus{border-color:var(--blue)}
.keyform input::placeholder{color:var(--line);letter-spacing:.35em}
.keyform button{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--paper);background:var(--blue);border:0;padding:.8rem 1.15rem;cursor:pointer;transition:background .2s}
.keyform button:hover{background:var(--blue-deep)}
.keyform.bad{animation:shake .35s}
.hint{margin:0;font-size:clamp(1.3rem,3.6vw,1.7rem);font-style:italic;min-height:1.3em;color:var(--ink)}

/* ---------- Vista de lectura ---------- */
.reading{width:100%;display:flex;flex-direction:column;align-items:center;gap:1.6rem}
.stage{transition:opacity .6s ease}
.stage.gone{opacity:0;pointer-events:none}

/* ---------- Tarjeta (gatita) ---------- */
.postcard{display:flex;justify-content:center}
.pcard{width:min(420px,100%);background:linear-gradient(180deg,#bcd5ec,#a9c7e4);border:1px solid rgba(0,0,0,.1);
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 30px 60px -34px rgba(0,0,0,.45);
  padding:22px 20px 26px;display:flex;flex-direction:column;align-items:center;gap:2px}
.postcard.pop .pcard{animation:pop 1.15s cubic-bezier(.2,.85,.25,1) both}
@keyframes pop{0%{opacity:0;transform:translateY(64px) scale(.5)}58%{opacity:1;transform:translateY(-8px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
.kitten{width:min(230px,64%);height:auto;display:block;margin-bottom:-10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12))}
.sign{position:relative;background:#f4ecd6;border:3px solid #2f8a4e;border-radius:3px;padding:14px 26px 16px;
  box-shadow:0 0 0 3px #f4ecd6,0 0 0 5px #2f8a4e;text-align:center}
.sign .hb{font-family:"Arial Black",Impact,sans-serif;font-weight:900;color:#e2452a;letter-spacing:.5px;
  font-size:clamp(1.1rem,4.6vw,1.5rem);text-transform:uppercase;line-height:1}
.sign .age{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:4px}
.sign .num{font-family:"Arial Black",Impact,sans-serif;font-weight:900;color:#e2452a;font-size:clamp(3.2rem,17vw,5rem);line-height:.78}
.sign .yo{font-family:"Arial Black",Impact,sans-serif;font-weight:900;color:#e2452a;text-transform:uppercase;
  font-size:clamp(1rem,4.2vw,1.35rem);line-height:1;text-align:left}

/* ---------- Carta ---------- */
.letter{background:var(--paper);padding:clamp(2rem,8vw,4.5rem) clamp(1.5rem,8vw,4.5rem);display:flex;flex-direction:column;gap:1.15rem;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 30px 60px -34px rgba(0,0,0,.25);animation:rise 1s cubic-bezier(.2,.8,.2,1)}
.letter .top{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:.9rem;margin-bottom:1rem;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.letter .top .final{color:var(--blue)}
.letter #body{display:flex;flex-direction:column;gap:1.75rem}
.letter p{margin:0;font-family:var(--serif);font-size:1.5rem;line-height:1.6;max-width:50ch;color:#1b2a5e}
.letter p.salute{font-size:2.1rem;font-style:italic}
.letter p.short{color:#394a86;font-style:italic}
.letter .caret{display:inline-block;width:2px;height:1em;background:var(--blue);margin-left:2px;vertical-align:-.12em;animation:blink 1s steps(1) infinite}
.letter .sign{font-family:var(--serif);font-style:italic;font-size:2.1rem;margin-top:1rem;color:var(--blue)}

.skip{position:fixed;z-index:20;right:16px;bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);
  background:var(--paper);border:1px solid var(--line);padding:.7rem .9rem;cursor:pointer}
.skip:hover{color:var(--ink);border-color:var(--ink)}
.skip:focus-visible{outline:1px solid var(--blue);outline-offset:3px}

/* ---------- Coda ---------- */
.coda{display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center}
.coda .big{font-size:clamp(2.4rem,10vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.coda p{margin:0;font-size:1.25rem;font-style:italic;color:var(--soft);max-width:34ch}

@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<main>
  <section class="stage">
    <div class="env" id="env">
      <div class="back"></div>
      <div class="sheet" aria-hidden="true"></div>
      <div class="front"><span>Para: Jimena</span><span>15.10.26</span></div>
      <div class="flap"></div>
      <div class="seal" id="seal" aria-hidden="true"><span class="wax">J</span></div>
    </div>
    <div class="status">
      <p class="label" id="meta">faltan para tu cumpleaños</p>
      <div class="count" id="count" aria-live="polite">
        <div><b id="cd">0</b><small>días</small></div>
        <div><b id="ch">00</b><small>hrs</small></div>
        <div><b id="cm">00</b><small>min</small></div>
        <div><b id="cs">00</b><small>seg</small></div>
      </div>
      <form class="keyform" id="keyform" autocomplete="off">
        <input id="clave" inputmode="numeric" maxlength="3" placeholder="· ·" aria-label="clave">
        <button type="submit">Abrir</button>
      </form>
      <p class="hint" id="hint"></p>
    </div>
  </section>

  <div class="reading" id="reading" hidden>
  <section class="postcard" id="postcard">
    <div class="pcard">
      <svg class="kitten" viewBox="0 0 240 232" xmlns="http://www.w3.org/2000/svg">
        <!-- cola -->
        <path d="M58 176 C18 166 20 118 44 108 C32 140 56 154 74 152 Z" fill="#f3ead3" stroke="#2a2622" stroke-width="3" stroke-linejoin="round"/>
        <!-- cuerpo -->
        <ellipse cx="120" cy="168" rx="60" ry="56" fill="#f3ead3" stroke="#2a2622" stroke-width="3.5"/>
        <!-- patitas -->
        <ellipse cx="101" cy="214" rx="19" ry="13" fill="#f3ead3" stroke="#2a2622" stroke-width="3"/>
        <ellipse cx="141" cy="214" rx="19" ry="13" fill="#f3ead3" stroke="#2a2622" stroke-width="3"/>
        <path d="M101 207 v10 M141 207 v10" stroke="#2a2622" stroke-width="2"/>
        <!-- orejas -->
        <path d="M70 56 L60 14 L110 44 Z" fill="#f3ead3" stroke="#2a2622" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M170 56 L180 14 L130 44 Z" fill="#b9b4ab" stroke="#2a2622" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M74 50 L68 26 L98 44 Z" fill="#e9a9a0"/>
        <path d="M166 50 L172 26 L142 44 Z" fill="#e9a9a0"/>
        <!-- cabeza -->
        <circle cx="120" cy="90" r="57" fill="#f3ead3" stroke="#2a2622" stroke-width="3.5"/>
        <!-- manchas tabby -->
        <path d="M94 52 Q120 38 152 54 Q150 74 120 72 Q96 72 94 52 Z" fill="#b9b4ab"/>
        <path d="M120 42 v26 M105 47 v20 M135 47 v20" stroke="#8f8980" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <!-- ojos -->
        <ellipse cx="100" cy="94" rx="13" ry="16.5" fill="#fff" stroke="#2a2622" stroke-width="2.5"/>
        <ellipse cx="140" cy="94" rx="13" ry="16.5" fill="#fff" stroke="#2a2622" stroke-width="2.5"/>
        <circle cx="102" cy="96" r="7.5" fill="#2f5aa8"/>
        <circle cx="138" cy="96" r="7.5" fill="#2f5aa8"/>
        <circle cx="102" cy="96" r="3.2" fill="#2a2622"/>
        <circle cx="138" cy="96" r="3.2" fill="#2a2622"/>
        <circle cx="104.5" cy="92.5" r="1.8" fill="#fff"/>
        <circle cx="140.5" cy="92.5" r="1.8" fill="#fff"/>
        <path d="M86 82 l-7 -4 M91 77 l-5 -5" stroke="#2a2622" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M154 82 l7 -4 M149 77 l5 -5" stroke="#2a2622" stroke-width="2" fill="none" stroke-linecap="round"/>
        <!-- cachetes -->
        <ellipse cx="80" cy="112" rx="11" ry="6.5" fill="#e9a9a0" opacity=".75"/>
        <ellipse cx="160" cy="112" rx="11" ry="6.5" fill="#e9a9a0" opacity=".75"/>
        <!-- nariz y boca -->
        <path d="M113 110 h14 l-7 8 z" fill="#e2452a" stroke="#2a2622" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M120 118 v6 M120 124 q-9 7 -15 1 M120 124 q9 7 15 1" fill="none" stroke="#2a2622" stroke-width="2" stroke-linecap="round"/>
        <!-- bigotes -->
        <path d="M70 102 h-34 M72 110 h-32 M158 102 h34 M156 110 h32" stroke="#2a2622" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <!-- moñito rojo -->
        <path d="M120 152 L90 134 L90 172 Z" fill="#e2452a" stroke="#2a2622" stroke-width="3" stroke-linejoin="round"/>
        <path d="M120 152 L150 134 L150 172 Z" fill="#e2452a" stroke="#2a2622" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="120" cy="152" r="10" fill="#e2452a" stroke="#2a2622" stroke-width="3"/>
      </svg>
      <div class="sign">
        <div class="hb">Happy Birthday</div>
        <div class="age"><span class="num">29</span><span class="yo">years<br>old!</span></div>
      </div>
    </div>
  </section>

  <article class="letter" id="letter" hidden>
    <div class="top"><span>Para Jimena</span><span>CDMX · 15.10.26</span></div>
    <div id="body"></div>
  </article>

  <section class="coda" id="coda" hidden>
    <span class="label">En vivo</span>
    <div class="big" id="lifeSec">0</div>
    <p>segundos desde que naciste en Cancún.</p>
  </section>
  </div>

  <button class="skip" id="skip" type="button" hidden>Ver la carta completa</button>
</main>

<script>
(function(){
  /* ===== Configuración ===== */
  var CLAVE = "29";                                   // tú se la pasas; sin pista en pantalla
  var OPEN = Date.parse("2026-10-15T00:00:00-06:00"); // solo para el countdown (visual)
  var BORN = Date.parse("1997-10-15T00:00:00-05:00");
  // Arranques que se escriben y se borran (el "escribo, borro, vuelvo a empezar"). [borrador, texto]
  // salute / s = línea corta / end = cierre / n = párrafo normal
  var LETTER = [
    ["salute","Jime:"],
    ["n","Llevo días intentando escribirte esta carta. Escribo, borro, se me ocurre algo, me acerco, me alejo y vuelvo a empezar. Hoy son las 8:27 y aquí sigo. A lo mejor tengo que escribir 29 cartas antes de que me salga la buena, una por cada año que cumples."],
    ["n","Ya sé, es solo una carta. Pero es tu cumpleaños y este año mi regalo son palabras. Me encantaría regalarte mil cosas, un viaje, pero por ahora el único viaje que te puedo regalar es por mis pensamientos. Y me gusta saber que con eso te basta, porque sé que no estás conmigo por nada material."],
    ["n","Buscando qué escribirte me di cuenta de que últimamente vivo buscando. Busco trabajo, busco dónde vivir, busco qué sigue. Y buscar cansa: unas cosas te aburren, otras te quedan grandes y piden credenciales que no tienes, y cuando sientes que ya estás cerca, se cae y vuelves a empezar. Igualito que con esta carta."],
    ["s","(Ya sé lo que estás pensando: \"otra vez este con su búsqueda de chamba, qué hueva\". Aguanta, aquí viene lo bueno.)"],
    ["n","La vida es un poco eso, una lista de búsquedas. Unas duran años y otras se resuelven sin que te des cuenta. Y lo curioso es que casi nunca notas el día en que dejas de buscar algo. Un día volteas y ya no estás buscando, porque ya lo encontraste."],
    ["n","Hace no tanto estuve en otra búsqueda que se sentía igual. Estaba buscando algo fuera de mi liga, algo que pedía credenciales que yo no tenía. Esa vez no buscaba trabajo, te buscaba a ti."],
    ["n","Porque si ser tu novio hubiera sido una vacante, los requisitos habrían sido: chamba estable, depa propio y la vida resuelta. Yo no cumplía ni uno. Apliqué igual. Y aquí estoy."],
    ["n","Luego me dices que ya no sabes qué consejo darme. Ya me lo diste sin darte cuenta: lo que vale la pena sí llega, aunque al principio parezca que no. Así que no me preocupa tanto lo que me falta. Si ya encontré lo más difícil, lo demás va a llegar."],
    ["n","Y si algún día te toca a ti estar buscando algo, acuérdate de esta carta: sí llega. Y mientras, lo buscamos juntos."],
    ["n","Así que sigo buscando trabajo, casa y todo lo demás. A ti ya no."],
    ["end","Feliz cumpleaños, Jimis."]
  ];
  /* ========================= */

  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var slow = (matchMedia("(pointer: coarse)").matches || matchMedia("(max-width: 640px)").matches) ? 1.5 : 1; // mas lento en celular
  var $ = function(id){return document.getElementById(id)};
  var env=$("env"), hint=$("hint"), meta=$("meta"), count=$("count"), keyform=$("keyform"), clave=$("clave");
  var pad = function(n){return String(n).padStart(2,"0")};
  var fmt = new Intl.NumberFormat("es-MX");
  var opened=false;

  /* countdown (solo visual) */
  function tick(){
    var diff=OPEN-Date.now();
    if (diff<=0){ $("cd").textContent="0"; $("ch").textContent="00"; $("cm").textContent="00"; $("cs").textContent="00"; meta.textContent="hoy es tu cumpleaños"; return; }
    var t=Math.floor(diff/1000);
    $("cd").textContent=Math.floor(t/86400);
    $("ch").textContent=pad(Math.floor(t%86400/3600));
    $("cm").textContent=pad(Math.floor(t%3600/60));
    $("cs").textContent=pad(t%60);
  }

  /* abrir con la clave */
  keyform.addEventListener("submit", function(e){
    e.preventDefault();
    if (opened) return;
    if (clave.value.trim()===CLAVE){ breakSeal(); }
    else {
      env.classList.remove("shake"); void env.offsetWidth; env.classList.add("shake");
      keyform.classList.remove("bad"); void keyform.offsetWidth; keyform.classList.add("bad");
      hint.textContent="esa no es, intenta otra vez";
      clave.value=""; clave.focus();
    }
  });
  clave.addEventListener("input", function(){ hint.textContent=""; });

  function breakSeal(){
    opened=true;
    try{ navigator.vibrate && navigator.vibrate([30,40,60]) }catch(_){}
    clave.blur();
    keyform.hidden=true; count.hidden=true;
    meta.textContent=""; hint.textContent="Para ti.";
    env.classList.add("open");              // se abre la solapa + sale el papel
    var stage=document.querySelector(".stage");
    setTimeout(function(){
      stage.classList.add("gone");          // el sobre se desvanece
      setTimeout(function(){
        stage.hidden=true;
        $("reading").hidden=false;
        $("postcard").classList.add("pop"); // la postal sale/crece
        $("reading").scrollIntoView({behavior:"auto", block:"start"});
        setTimeout(function(){ $("letter").hidden=false; writeLetter(); }, reduce?0:1500);
      }, 650);
    }, 1700);
  }

  /* la carta se escribe sola — y se borra */
  var skipped=false, caret=document.createElement("span"); caret.className="caret";
  var SKIP={};
  function wait(ms){ return new Promise(function(r,j){ if(skipped) return j(SKIP); setTimeout(function(){ skipped ? j(SKIP) : r(); }, ms); }); }
  function cls(kind){ return kind==="salute"?"salute":kind==="s"?"short":(kind==="sign"||kind==="end")?"sign":""; }
  function render(p){ p.textContent=p._t; p.appendChild(caret); }
  function newP(kind){
    var p=document.createElement((kind==="sign"||kind==="end")?"span":"p");
    p.className=cls(kind); p._t=""; $("body").appendChild(p); render(p);
    caret.scrollIntoView({behavior:"smooth", block:"nearest"});
    return p;
  }
  function delay(ch, base){
    if (ch==="."||ch==="?") return 420*slow; if (ch===","||ch===":") return 220*slow; if (ch==="…") return 560*slow;
    return (base + Math.random()*base) * slow;
  }
  async function type(p, text, base){ for (var i=0;i<text.length;i++){ p._t+=text[i]; render(p); await wait(delay(text[i], base)); } }
  async function back(p, n){ for (var i=0;i<n;i++){ p._t=p._t.slice(0,-1); render(p); await wait(22); } }
  function renderFinal(){
    var body=$("body"); body.innerHTML="";
    LETTER.forEach(function(l){ var p=document.createElement((l[0]==="sign"||l[0]==="end")?"span":"p"); p.className=cls(l[0]); p.textContent=l[1]; body.appendChild(p); });
  }
  async function writeLetter(){
    var sk=$("skip");
    if (reduce){ renderFinal(); return finish(); }
    sk.hidden=false;
    try{
      for (var i=0;i<LETTER.length;i++){
        var kind=LETTER[i][0], text=LETTER[i][1];
        var q=newP(kind);
        var base = kind==="salute" ? 80 : (kind==="end" ? 90 : (i<3 ? 46 : 38));
        await type(q, text, base);
        await wait((kind==="salute" ? 700 : (kind==="end" ? 300 : 620)) * slow);
      }
    } catch(e){ if (e!==SKIP) throw e; renderFinal(); }
    finish();
  }
  function finish(){
    $("skip").hidden=true;
    caret.remove();
    $("coda").hidden=false;
    (function t(){ $("lifeSec").textContent=fmt.format(Math.floor((Date.now()-BORN)/1000)); setTimeout(t,1000); })();
  }
  $("skip").addEventListener("click", function(){ skipped=true; });

  tick();
  setInterval(function(){ if(!opened) tick(); }, 1000);
  window.addEventListener("load", function(){ clave.focus(); });
})();
</script>

</body>
